<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Splonk</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Splonk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f4d36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7eee5; --surface:#fbfcf8; --surface2:#dfe7dc; --ink:#0f2a1f; --ink2:#3f5a4c; --muted:#6f8679;
  --line:#d3ddd0; --accent:#0f4d36; --accent-ink:#ffffff; --accent-soft:#d2e6d7; --warn:#a85d00; --bad:#c2321f; --good:#1e7a4c;
  --flag:#e23b2a; --sand:#e6d4a3; --stripeA:#2c744b; --stripeB:#337e53; --band-ink:#f4fbf3; --band-dim:rgba(244,251,243,.72);
  --chart:#0f4d36; --grid:#dbe4d8; --radius:16px;
  --font:'Bricolage Grotesque',system-ui,sans-serif; --mono:'Bricolage Grotesque',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1611; --surface:#13221a; --surface2:#1b2e23; --ink:#e8f1ea; --ink2:#b4c7ba; --muted:#86a091;
  --line:#243a2d; --accent:#6bcb8f; --accent-ink:#06170d; --accent-soft:#1c3a28; --warn:#e0a24a; --bad:#ff7a66; --good:#6bcb8f;
  --flag:#ff6a55; --sand:#c9b47e; --stripeA:#1b4d32; --stripeB:#205639;
  --chart:#6bcb8f; --grid:#203327;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tile .v,.hero .big,.stepper .val,.sumbar .v{font-variant-numeric:tabular-nums;font-stretch:80%}
body{font-variation-settings:'opsz' 14}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;max-width:860px;margin:0 auto}
.brand{font-weight:800;font-size:23px;letter-spacing:-.035em;font-stretch:85%;display:flex;align-items:center;gap:6px}
.brand svg{width:34px;height:34px;margin:-4px 0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)}
main{max-width:860px;margin:0 auto;padding:6px 14px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .wrap{display:flex;max-width:860px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent)}
nav.tabs a.on svg{background:var(--accent-soft);border-radius:99px;padding:2px 12px;width:46px;box-sizing:content-box;margin:-2px 0}
h1{font-size:34px;font-weight:800;font-stretch:78%;letter-spacing:-.035em;line-height:1;margin:14px 4px 14px}
h2{font-size:19px;font-weight:700;font-stretch:85%;margin:26px 4px 10px;letter-spacing:-.02em}
h3{font-size:14px;margin:0 0 6px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.f{display:block;font-size:12.5px;color:var(--ink2);font-weight:500;margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
label.f textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 12px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink2)}
.hero{text-align:center;padding:22px 16px}
.hero .big{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2);font-weight:500}
.pill.g{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1;min-width:0}
.list .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* live */
.holes{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.holes::-webkit-scrollbar{display:none}
.holes button{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-family:var(--mono);font-size:13px;cursor:pointer;position:relative}
.holes button.done{background:var(--surface2)}
.holes button.cur{background:var(--flag);color:#fff;border-color:var(--flag)}
.holes button{font-family:var(--font)!important;font-size:15px!important;font-stretch:85%}
.holehead{display:flex;justify-content:space-between;align-items:flex-end}
.holehead .no{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.holehead .meta{text-align:right;font-size:13px;color:var(--ink2)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper:last-child{border-bottom:0}
.stepper .lab{font-weight:600}
.stepper .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper .ctl button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:24px;font-weight:500;cursor:pointer;line-height:1}
.stepper .val{min-width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;position:relative}
.val.ring1,.val.ring2{border:2.5px solid var(--flag);border-radius:50%;color:var(--flag)}
.val.ring2{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--flag)}
.val.box1,.val.box2{border:2.5px solid var(--ink2);border-radius:6px}
.val.box2{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--ink2)}
.opts{display:flex;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer;min-width:52px}
.opts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sumbar{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:4px}
.sumbar .k{font-size:11.5px;color:var(--muted)} .sumbar .v{font-weight:700;font-size:24px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px} .dots i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
/* fairway band */
.band{background:repeating-linear-gradient(100deg,var(--stripeA) 0 38px,var(--stripeB) 38px 76px);color:var(--band-ink);border-radius:22px;padding:18px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.band .lbl{font-size:13px;color:var(--band-dim);font-weight:500}
.band .muted,.band .tiny.muted,.band .small.muted{color:var(--band-dim)}
.band .pill{background:rgba(255,255,255,.16);color:var(--band-ink)}
.band.hero{text-align:left;padding:22px 20px}
.band .big{color:#fff}
.hole-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hno{font-size:104px;font-weight:800;font-stretch:75%;letter-spacing:-.06em;line-height:.82;margin-top:6px}
.hole-art{width:150px;height:118px;flex:0 0 auto}
.hole-meta{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:15px;flex-wrap:wrap}
.hole-meta b{font-size:20px;font-stretch:85%}
.statrow{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.statrow .k{font-size:12.5px;color:var(--band-dim)} .statrow .v{font-size:28px;font-weight:700;font-stretch:80%;line-height:1.1}
.lhr{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0 4px}
.lhr span{display:block;height:100%}
.player{display:flex;align-items:center;gap:12px;margin:8px 4px 0}
.player .av{width:46px;height:46px;border-radius:50%;background:var(--flag);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;font-stretch:85%}
.player .pn{font-weight:700;font-size:18px;letter-spacing:-.01em}
/* course picker */
.cp-box{background:var(--surface2);border-radius:14px;padding:8px}
.cp-in{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 10px;color:var(--muted)}
.cp-in input{flex:1;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none;color:var(--ink);min-width:0}
.cp-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cp-res{max-height:330px;overflow:auto}
.cp-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 8px;border-radius:10px;cursor:pointer}
.cp-row:hover,.cp-row:focus-visible{background:var(--surface)}
.cp-row .t{display:block;font-weight:600;font-size:15px}
.cp-row b{color:var(--accent)}
.cp-empty{padding:14px 8px 6px}
.cp-chosen{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:12px 12px 12px 14px}
.cp-chosen .t{font-weight:700;font-size:16px}
.tees{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tee{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tee:hover{border-color:var(--accent)}
.tee .tn{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.tee .dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:inline-block}
/* scorecard */
.sc{overflow-x:auto}
.sc table{border-collapse:collapse;font-size:13px;min-width:100%}
.sc th,.sc td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600}
.sc td.num{font-family:var(--mono)}
.sc .tot{font-weight:700;background:var(--surface2)}
.sc .b{display:inline-block;min-width:22px;padding:1px 4px;border-radius:50%}
.sc .under{border:1.5px solid var(--flag);border-radius:50%;color:var(--flag)}
.sc .over{border:1.5px solid var(--ink2);border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
table.t tr.counted td{background:var(--accent-soft)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.bars .b{display:grid;grid-template-columns:92px 1fr 56px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.bars .track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--chart);border-radius:0 4px 4px 0}
.bars .v{font-family:var(--mono);text-align:right;color:var(--ink2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet.full{max-width:980px;height:100%;max-height:100%;border-radius:0}
@media (min-width:700px){.sheet.full{height:94vh;border-radius:18px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .hd h2{margin:0;font-size:18px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90vw}
/* video */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.vcard video{width:100%;aspect-ratio:9/12;object-fit:cover;background:#000;display:block;pointer-events:none}
.vcard .m{padding:8px 10px}
.vcard .m .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.players{display:flex;gap:8px;justify-content:center}
.pwrap{position:relative;flex:1;min-width:0;background:#000;border-radius:12px;overflow:hidden}
.pwrap video{width:100%;height:52vh;object-fit:contain;display:block}
.pwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.vctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.vctl input[type=range]{flex:1 1 100%;accent-color:var(--accent)}
.ai{white-space:normal;font-size:14px}
.ai p{margin:0 0 8px}
.hidden{display:none!important}
.sihint{font-size:12px;color:var(--warn)}
.cedit td{padding:3px 4px} .cedit input,.cedit select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
details .body{font-size:13.5px;color:var(--ink2)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(-8 0)"><ellipse cx="60" cy="99" rx="34" ry="9" fill="#8fd1a6"></ellipse>
<ellipse cx="60" cy="99" rx="7.5" ry="3" fill="#0b2a1c"></ellipse>
<rect x="56.5" y="14" width="7" height="86" rx="3.5" style="fill:var(--ink)"></rect>
<path d="M63 18 C 73 13, 83 24, 98 18 C 95 29, 95 38, 98 48 C 83 54, 73 43, 63 48 Z" fill="#e23b2a"></path>
<path d="M63 18 C 73 13, 83 24, 98 18 C 97 21, 96 24, 96 27 C 82 32, 73 22, 63 26 Z" fill="#ffffff" opacity=".18"></path></g></svg>splonk</div>
  <div class="row"><span id="sync" class="sync"><i></i><span>This device</span></span><button class="x" id="gear" title="Settings" aria-label="Settings">⚙</button></div>
</header>
<main id="view"></main>
<nav class="tabs"><div class="wrap">
  <a href="#play" data-t="play"><svg viewBox="0 0 24 24"><path d="M6 21V3l10 4-10 4"/><path d="M4 21h8"/></svg>Play</a>
  <a href="#stats" data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
  <a href="#handicap" data-t="handicap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Handicap</a>
  <a href="#videos" data-t="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Videos</a>
  <a href="#bag" data-t="bag"><svg viewBox="0 0 24 24"><path d="M8 7h8l1 14H7z"/><path d="M10 7V3M14 7V2M12 7V4"/></svg>Bag</a>
</div></nav>

<script>
/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const r1 = x => Math.round(x * 10) / 10;
const f1 = x => (x == null || isNaN(x)) ? '–' : (Math.round(x * 10) / 10).toFixed(1);
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
const signed = x => x == null ? '–' : (x > 0 ? '+' + x : x === 0 ? 'E' : String(x));
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m - 1]} ${y}`; };
const fmtHcp = x => x == null ? '–' : (x < 0 ? '+' + Math.abs(x).toFixed(1) : x.toFixed(1));
const num = v => { if (v === '' || v == null) return null; const n = Number(v); return isNaN(n) ? null : n; };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function setSync(text, cls) { const s = $('#sync'); s.className = 'sync ' + (cls || ''); s.lastChild.textContent = text; }
const claudeUse = name => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

/* =========================================================
   Storage: cloud (artifact db, private per user) with local cache
   ========================================================= */
const Store = {
  docs: {}, col: null, queue: {}, dirty: new Set(), timers: {}, lastSig: '',
  load() { try { this.docs = JSON.parse(localStorage.getItem('fairway.docs') || '{}'); } catch (e) { this.docs = {}; } },
  cache() { try { localStorage.setItem('fairway.docs', JSON.stringify(this.docs)); } catch (e) {} },
  async connect() {
    const [db, user] = await Promise.all([claudeUse('db'), claudeUse('user')]);
    if (!db || !user) { if (!(await Cloud.connect())) setSync('Saved on this device'); return; }
    const id = await user.id();
    if (!id) { setSync('Saved on this device'); return; }
    try { this.col = db.collection('data/users/' + id); } catch (e) { return; }
    setSync('Connecting…');
    const timer = setTimeout(() => setSync('Cloud not reachable yet', 'warn'), 10000);

/* =========================================================
   Cloudflare sync (self-hosted version): /api on the same site,
   signed in with Cloudflare Access. A copy stays on the phone, changes
   queue while offline and upload when back online.
   ========================================================= */
const Cloud = {
  on: false, email: null, since: 0, pending: new Set(), timer: null, flushing: false, pulling: false, authLost: false,
  lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  savePending() { this.lsSet('splonk.pending', [...this.pending]); },
  key() { try { return localStorage.getItem('splonk.key') || ''; } catch (e) { return ''; } },
  async api(path, opts = {}) {
    const k = this.key();
    const res = await fetch('/api/' + path, { credentials: 'same-origin', cache: 'no-store', redirect: 'manual', ...opts, headers: { 'content-type': 'application/json', ...(k ? { 'X-Splonk-Key': k } : {}), ...(opts.headers || {}) } });

  status() {
    if (this.authLost) return setSync(this.keyMode ? 'Locked — tap to enter key' : 'Signed out — tap to sign in', 'warn');
    if (!navigator.onLine) return setSync(this.pending.size ? 'Offline — saved on phone' : 'Offline', 'warn');
    if (this.pending.size) return setSync('Saving…');
    setSync('Synced', 'ok');
  },
  async connect() {
    if (location.protocol === 'file:') return false;
    let me;
    try { me = await this.api('me'); }
    catch (e) {
      if (e.auth && (e.code === 'key_required' || e.code === 'key_wrong')) { this.on = true; this.authLost = true; this.keyMode = true; this.status(); this.bind(); this.askKey(e.code === 'key_wrong'); return true; }
      if (e.auth) { this.on = true; this.authLost = true; this.status(); this.bind(); return true; }
      return false;
    }
    this.keyMode = me.email === 'owner';
    this.on = true; this.email = me.email;
    this.pending = new Set(this.lsGet('splonk.pending', []));
    this.bind();
    setSync('Syncing…');
    try {
      const prevUser = this.lsGet('splonk.cloudUser', null);
      if (!prevUser && Object.keys(Store.docs).length) {
        await this.api('import', { method: 'POST', body: JSON.stringify({ docs: Store.docs }) });
      } else if (prevUser && prevUser !== this.email) {
        Store.docs = {}; this.pending.clear(); this.savePending();
      }
      this.lsSet('splonk.cloudUser', this.email);
      await this.pull(true);
      await this.flush();
    } catch (e) { this.handleError(e); }

  },
  bind() {

    window.addEventListener('online', () => { this.flush(); this.pull(); });
    window.addEventListener('offline', () => this.status());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { this.pull(); this.flush(); } });
    setInterval(() => { if (document.visibilityState === 'visible') { this.pull(); if (this.pending.size) this.flush(); } }, 45000);
    $('#sync').style.cursor = 'pointer';
    $('#sync').addEventListener('click', () => { if (this.authLost) { if (this.keyMode) this.askKey(false); else location.reload(); } else { this.flush(); this.pull(); } });
  },
  handleError(e) {
    if (e && e.auth) { this.authLost = true; if (e.code === 'key_required' || e.code === 'key_wrong') this.keyMode = true; }
    this.status();
  },
  askKey(wrong) {
    if (document.querySelector('#keyIn')) return;
    const m = openSheet(`<div class="hd"><h2>Unlock Splonk</h2><button class="x" data-close>×</button></div>
      <p style="margin-top:0">Enter the private key you saved in Cloudflare as <b>APP_KEY</b>. You only need to do this once on each phone.</p>
      ${wrong ? '<p class="sihint" style="margin-top:0">That key didn’t match. Check it and try again.</p>' : ''}
      <label class="f">Private key<input id="keyIn" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>
      <button class="btn primary block" id="keyGo">Unlock</button>
      <p class="tiny muted">Until you unlock, anything you record is saved on this phone and uploads once you do.</p>`);
    const go = async () => {
      const v = $('#keyIn', m.el).value.trim(); if (!v) return;
      try { localStorage.setItem('splonk.key', v); } catch (e) {}
      m.close(); this.authLost = false; this.bound = true;
      const ok = await this.connect();
      if (ok && !this.authLost) toast('Unlocked. Your rounds now save to the cloud.');
    };
    $('#keyGo', m.el).onclick = go;
    $('#keyIn', m.el).addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    setTimeout(() => $('#keyIn', m.el).focus(), 50);
  },
  async downloadBackup() {
    try {
      const k = this.key();
      const res = await fetch('/api/export', { credentials: 'same-origin', cache: 'no-store', headers: k ? { 'X-Splonk-Key': k } : {} });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'splonk-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('Couldn’t download the backup — check your connection.'); }
  },
  mark(key, debounce) {
    this.pending.add(key); this.savePending(); this.status();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), debounce ? 900 : 50);
  },
  async flush() {
    if (!this.on || this.flushing || this.authLost || !navigator.onLine) { this.status(); return; }
    this.flushing = true;
    try {
      while (this.pending.size) {
        const key = this.pending.values().next().value;
        const data = Store.docs[key];
        if (data === undefined) await this.api('docs/' + encodeURIComponent(key), { method: 'DELETE' });
        else await this.api('docs/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify({ data }) });
        if (Store.docs[key] === data) { this.pending.delete(key); this.savePending(); }
      }
    } catch (e) { this.handleError(e); }
    this.flushing = false;
    this.status();
  },
  async pull(full) {
    if (!this.on || this.pulling || this.authLost || !navigator.onLine) return;
    this.pulling = true;
    try {
      const since = full ? 0 : this.since;
      const res = await this.api('docs?since=' + since);
      let next;
      if (full) {
        next = {};
        for (const d of res.docs) if (!d.deleted) next[d.key] = d.data;
        for (const k of this.pending) { if (k in Store.docs) next[k] = Store.docs[k]; else delete next[k]; }
      } else {
        next = { ...Store.docs };
        for (const d of res.docs) { if (this.pending.has(d.key)) continue; if (d.deleted) delete next[d.key]; else next[d.key] = d.data; }

      this.since = res.latest || since;
      const sig = JSON.stringify(next);
      if (sig !== JSON.stringify(Store.docs)) { Store.docs = next; Store.cache(); hydrate(); if (!document.querySelector('.ov')) render(); }
    } catch (e) { this.handleError(e); }
    this.pulling = false;
    this.status();
  }
};

const DEFAULT_SETTINGS = { gender: 'm', officialHcp: null, useOfficial: false, name: '' };
const S = { settings: { ...DEFAULT_SETTINGS }, rounds: [], courses: [], bag: [], videos: [], active: null };
function hydrate() {
  const d = Store.docs;
  S.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
  S.active = d.active && d.active.round ? d.active.round : null;
  const by = p => Object.keys(d).filter(k => k.startsWith(p)).map(k => d[k]);
  S.rounds = by('r_').sort((a, b) => (a.date + (a.started || 0)).localeCompare(b.date + (b.started || 0)) || (a.started || 0) - (b.started || 0));
  S.courses = by('c_').sort((a, b) => a.name.localeCompare(b.name));

/* =========================================================
   Golf Australia handicapping (Australian Rules of Handicapping, WHS)
   ========================================================= */
const CONSISTENCY = { m: 0.9986, f: 1.0483 };
function dailyHandicap(hi, rating, gender) {
  if (hi == null || !rating || rating.slope == null || rating.scratch == null) return null;
  const cf = CONSISTENCY[gender] || CONSISTENCY.m;
  const base = rating.nine ? ((hi / 2) * rating.slope / 113 + (rating.scratch - rating.par))
                           : (hi * rating.slope / 113 + (rating.scratch - rating.par));
  return Math.round(base * 0.93 * cf);
}
// strokes received on a hole, rank = stroke-index order among the holes being played (1 = hardest)
function strokesOn(rank, n, dh) {
  if (dh == null) return 0;
  if (dh >= 0) return Math.floor(dh / n) + (rank <= dh % n ? 1 : 0);
  const p = -dh; return -(Math.floor(p / n) + (rank > n - (p % n) ? 1 : 0));
}
function holeLimit(h, dh, n) { return h.par + 2 + strokesOn(h.rank, n, dh); } // net double bogey
function pointsOn(h, dh, n) { if (h.pickup || h.strokes == null) return 0; return Math.max(0, 2 + h.par + strokesOn(h.rank, n, dh) - h.strokes); }
const BEST = { 3: [1, -2], 4: [1, -1], 5: [1, 0], 6: [2, -1], 7: [2, 0], 8: [2, 0], 9: [3, 0], 10: [3, 0], 11: [3, 0], 12: [4, 0], 13: [4, 0], 14: [4, 0], 15: [5, 0], 16: [5, 0], 17: [6, 0], 18: [6, 0], 19: [7, 0], 20: [8, 0] };
function roundComplete(r) { return r.quick ? r.ags != null : r.holes.every(h => h.strokes != null || h.pickup); }
function eligible(r) { return r.counts && roundComplete(r) && r.rating && r.rating.slope && r.rating.scratch != null; }
const isNine = r => r.format !== '18';

function computeHandicap(rounds, settings) {
  const recs = []; const history = []; let index = null; let pending = null; let lastCap = null;
  const sorted = rounds.filter(eligible).slice().sort((a, b) => a.date.localeCompare(b.date) || (a.started || 0) - (b.started || 0));
  for (const r of sorted) {
    const before = index != null ? index : (settings.officialHcp != null ? settings.officialHcp : null);
    const n = isNine(r) ? 9 : 18;
    let dh = before != null ? dailyHandicap(before, r.rating, settings.gender) : (isNine(r) ? 27 : 54);
    let ags;
    if (r.quick) ags = r.ags;
    else ags = r.holes.reduce((s, h) => s + (h.pickup || h.strokes == null ? holeLimit(h, dh, n) : Math.min(h.strokes, holeLimit(h, dh, n))), 0);
    const diff = r1((113 / r.rating.slope) * (ags - r.rating.scratch - (r.pcc || 0)));
    let rec = null;
    if (n === 18) rec = { date: r.date, diff, adj: 0, ids: [r.id], label: 'Round', ags };
    else if (pending) { rec = { date: r.date, diff: r1(pending.diff + diff), adj: 0, ids: [pending.id, r.id], label: '9 + 9', ags: pending.ags + ags }; pending = null; }
    else { pending = { id: r.id, diff, date: r.date, ags }; continue; }
    recs.push(rec);
    // Exceptional score reduction (vs handicap before this score)
    if (index != null) {
      const gap = index - rec.diff;
      const red = gap >= 10 ? 2 : gap >= 7 ? 1 : 0;
      if (red) { recs.slice(-20).forEach(x => x.adj -= red); rec.esr = red; }
    }
    const last = recs.slice(-20); const cnt = last.length;
    if (cnt < 3) { history.push({ date: rec.date, index: null }); continue; }
    const [k, adj] = BEST[cnt];
    const ranked = last.map(x => ({ x, v: x.diff + x.adj })).sort((a, b) => a.v - b.v);
    recs.forEach(x => x.counted = false);
    ranked.slice(0, k).forEach(o => o.x.counted = true);
    let calc = r1(ranked.slice(0, k).reduce((s, o) => s + o.v, 0) / k + adj);
    lastCap = null;
    // Soft cap (3) and hard cap (5) against the Low Handicap in the previous 12 months
    if (recs.length >= 20) {
      const cutoff = new Date(new Date(rec.date) - 365 * 864e5).toISOString().slice(0, 10);
      const prior = history.filter(h => h.index != null && h.date >= cutoff);
      if (prior.length) {
        const low = Math.min(...prior.map(h => h.index));
        if (calc - low > 3) { const capped = r1(low + 3 + (calc - low - 3) * 0.5); lastCap = { type: 'soft', low, raw: calc }; calc = capped; }

  }

  let low = null;
  if (recs.length >= 20) { const lastDate = recs[recs.length - 1].date; const cutoff = new Date(new Date(lastDate) - 365 * 864e5).toISOString().slice(0, 10); const pr = history.filter(h => h.index != null && h.date >= cutoff); if (pr.length) low = Math.min(...pr.map(h => h.index)); }

}

function playingIndex() {
  if (S.settings.useOfficial && S.settings.officialHcp != null) return { hi: S.settings.officialHcp, src: 'official' };
  if (HC.index != null) return { hi: HC.index, src: 'calculated' };
  if (S.settings.officialHcp != null) return { hi: S.settings.officialHcp, src: 'official' };
  return { hi: null, src: 'none' };
}

/* =========================================================
   Courses & ratings
   ========================================================= */
function ratingFor(course, format) {
  const holes = course.holes;
  if (format === '18') return { scratch: num(course.scratch), slope: num(course.slope), par: holes.reduce((s, h) => s + h.par, 0), nine: false };
  const part = format === 'front' ? holes.slice(0, 9) : holes.slice(9, 18);
  const r = course[format] || {};
  const par = part.reduce((s, h) => s + h.par, 0);
  const approx = r.scratch == null || r.scratch === '' || r.slope == null || r.slope === '';
  return { scratch: approx ? (num(course.scratch) != null ? r1(num(course.scratch) / 2) : null) : num(r.scratch), slope: approx ? num(course.slope) : num(r.slope), par, nine: true, approx };
}
function playedHoles(course, format) {
  const all = course.holes.map((h, i) => ({ n: i + 1, par: +h.par, si: +h.si }));
  const list = format === 'front' ? all.slice(0, 9) : format === 'back' ? all.slice(9, 18) : all;
  const order = list.slice().sort((a, b) => a.si - b.si);
  order.forEach((h, i) => h.rank = i + 1);
  return list.map(h => ({ ...h, strokes: null, putts: null, fw: null, gir: null, pen: 0, sand: false, pickup: false }));
}

/* =========================================================
   Round statistics
   ========================================================= */
function girOf(h) { if (h.gir != null) return h.gir; if (h.strokes == null || h.putts == null || h.pickup) return h.pickup ? false : null; return h.strokes - h.putts <= h.par - 2; }

    st.played++; st.gross += strokes; st.par += h.par; st.pen += h.pen || 0; st.pts += pointsOn(h, r.dh, n);
    if (h.pickup) st.pickups++;

    if (h.par > 3 && h.fw) { st.fwN++; if (h.fw === 'hit') st.fwHit++; if (h.fw === 'L') st.fwL++; if (h.fw === 'R') st.fwR++; }
    const g = girOf(h);
    if (g != null) { st.girN++; if (g) { st.gir++; if (h.putts != null) st.puttsOnGir += h.putts; } else { st.scrN++; if (!h.pickup && strokes <= h.par) st.scrOk++; } }

}
function aggregate(rounds) {

  for (const r of rounds) {

    if (s.n === 18) { A.n18++; A.gross18.push(s.gross); A.toPar18.push(s.toPar); if (s.pts != null) A.pts18.push(s.pts); if (!s.quick && s.puttHoles === 18) A.putts18.push(s.putts); else if (s.quick && s.putts != null) A.putts18.push(s.putts); }

/* =========================================================
   Charts (single-series line with hover; simple bars)
   ========================================================= */
function lineChart(points, { fmt = v => v, height = 170, title = '' } = {}) {
  const id = 'ch' + Math.random().toString(36).slice(2, 8);
  CHARTS[id] = { points, fmt, height };

const CHARTS = {};
function drawCharts() {
  for (const id in CHARTS) {
    const el = document.getElementById(id); if (!el) { delete CHARTS[id]; continue; }
    const { points, fmt, height } = CHARTS[id];
    const W = el.clientWidth || 320, H = height, pl = 34, pr = 10, pt = 12, pb = 22;
    if (points.length < 2) { el.innerHTML = `<div class="muted small" style="padding:20px 0;text-align:center">Add another round to see a trend.</div>`; continue; }
    const ys = points.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
    if (lo === hi) { lo -= 1; hi += 1; }
    const padY = (hi - lo) * 0.12; lo -= padY; hi += padY;
    const step = niceStep((hi - lo) / 4); const t0 = Math.ceil(lo / step) * step;
    const X = i => pl + (W - pl - pr) * (points.length === 1 ? .5 : i / (points.length - 1));
    const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
    let g = '';
    for (let v = t0; v <= hi; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Bricolage Grotesque, system-ui, sans-serif">${fmt(r1(v))}</text>`;
    const d = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const showDots = points.length <= 30;
    const dots = showDots ? points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`).join('') : '';
    const xl = `<text x="${pl}" y="${H - 4}" font-size="11" fill="var(--muted)">${esc(points[0].x)}</text><text x="${W - pr}" y="${H - 4}" font-size="11" text-anchor="end" fill="var(--muted)">${esc(points[points.length - 1].x)}</text>`;
    el.innerHTML = `<svg width="${W}" height="${H}">${g}<path d="${d}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<line class="xh" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/><circle class="hd" r="5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2" opacity="0"/><rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
    const svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), hd = $('.hd', el);
    const move = e => {
      const rect = svg.getBoundingClientRect(); const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      let i = Math.round((cx - pl) / (W - pl - pr) * (points.length - 1)); i = Math.max(0, Math.min(points.length - 1, i));
      const p = points[i]; xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('opacity', 1); hd.setAttribute('cx', X(i)); hd.setAttribute('cy', Y(p.y)); hd.setAttribute('opacity', 1);
      tip.innerHTML = `<b>${esc(fmt(p.y))}</b> · ${esc(p.x)}${p.sub ? ' · ' + esc(p.sub) : ''}`; tip.style.left = X(i) + 'px'; tip.style.top = Y(p.y) + 'px'; tip.style.opacity = 1;
    };
    const leave = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); hd.setAttribute('opacity', 0); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
  }
}

const scoreName = d => d <= -3 ? 'Albatross' : d === -2 ? 'Eagle' : d === -1 ? 'Birdie' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double bogey' : d === 3 ? 'Triple bogey' : '+' + d;
function ringClass(h) { if (h.strokes == null || h.pickup) return ''; const d = h.strokes - h.par; return d <= -2 ? 'ring2' : d === -1 ? 'ring1' : d === 1 ? 'box1' : d >= 2 ? 'box2' : ''; }
function holeArt(h) {

  else if (h.par === 4) { gx = fx(104); fair = `<path d="M${fx(70)} 100 C ${fx(68)} 70, ${fx(70)} 52, ${fx(98)} 34" stroke="rgba(255,255,255,.22)" stroke-width="22" fill="none" stroke-linecap="round"/>`; bunk = `<ellipse cx="${fx(50)}" cy="58" rx="8" ry="5" fill="var(--sand)"/><ellipse cx="${fx(122)}" cy="30" rx="7" ry="4.5" fill="var(--sand)"/>`; }
  else { gx = fx(62); gy = 18; fair = `<path d="M${fx(70)} 100 C ${fx(100)} 80, ${fx(104)} 62, ${fx(82)} 50 S ${fx(54)} 32, ${fx(62)} 24" stroke="rgba(255,255,255,.22)" stroke-width="20" fill="none" stroke-linecap="round"/>`; bunk = `<ellipse cx="${fx(112)}" cy="66" rx="8" ry="5" fill="var(--sand)"/><ellipse cx="${fx(40)}" cy="30" rx="7" ry="4.5" fill="var(--sand)"/>`; }

async function finishRound() {

function scorecardHtml(r) {
  const n = r.holes.length;

    <tr><td>Putts</td>${hs.map(h => `<td class="num">${h.putts ?? ''}</td>`).join('')}<td class="num tot">${sum(hs, h => h.putts)}</td></tr>
    <tr><td>Pts</td>${hs.map(h => `<td class="num">${(h.strokes != null || h.pickup) ? pointsOn(h, r.dh, n) : ''}</td>`).join('')}<td class="num tot">${sum(hs, h => pointsOn(h, r.dh, n))}</td></tr>
    <tr><td>FW</td>${hs.map(h => `<td>${h.par === 3 ? '' : h.fw === 'hit' ? '●' : h.fw === 'L' ? '←' : h.fw === 'R' ? '→' : ''}</td>`).join('')}<td class="tot"></td></tr>
    <tr><td>GIR</td>${hs.map(h => { const g = girOf(h); return `<td>${g ? '●' : g === false ? '○' : ''}</td>`; }).join('')}<td class="tot"></td></tr>
  </table></div>`).join('');
}
function scorecardSheet(r) { openSheet(`<div class="hd"><h2>Scorecard</h2><button class="x" data-close>×</button></div>${scorecardHtml(r)}<p class="tiny muted">P = picked up (counted as net double bogey for handicap). ● hit, ○ missed.</p>`); }

    ${h.last20.slice().reverse().map(x => `<tr class="${x.counted ? 'counted' : ''}"><td>${fmtDate(x.date)}</td><td class="small">${esc(x.ids.map(id => S.rounds.find(r => r.id === id)?.course.name || '').filter(Boolean)[0] || '')}${x.label === '9 + 9' ? ' <span class="pill">9+9</span>' : ''}${x.esr ? ` <span class="pill g">Exceptional −${x.esr}</span>` : ''}</td><td class="r num">${x.ags}</td><td class="r num">${f1(x.diff + x.adj)}${x.adj ? `<span class="tiny muted"> (${f1(x.diff)})</span>` : ''}</td></tr>`).join('')}</table>

const MAX_UPLOAD = 19.5 * 1024 * 1024;
const localUrls = {};
const IDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { try { const r = indexedDB.open('fairway-videos', 1); r.onupgradeneeded = () => r.result.createObjectStore('v'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async put(k, blob) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('v', 'readwrite'); t.objectStore('v').put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('v').objectStore('v').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const t = db.transaction('v', 'readwrite'); t.objectStore('v').delete(k); t.oncomplete = res; t.onerror = res; }); }
};
async function videoSrc(vd) {
  if (vd.assetId) return vd.url || ('/_blob/' + vd.assetId);
  if (localUrls[vd.id]) return localUrls[vd.id];
  try { const b = await IDB.get(vd.id); if (b) return localUrls[vd.id] = URL.createObjectURL(b); } catch (e) {}
  return null;
}

async function compressVideo(file, onProg) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video'); v.src = url; v.muted = true; v.playsInline = true;
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = rej; });
  const long = Math.max(v.videoWidth, v.videoHeight); const sc = Math.min(1, 960 / long);
  const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * sc / 2) * 2; c.height = Math.round(v.videoHeight * sc / 2) * 2;
  const ctx = c.getContext('2d');
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mime) throw new Error('no recorder');
  const bps = Math.min(4e6, Math.floor(MAX_UPLOAD * 8 * 0.85 / Math.max(1, v.duration)));
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: bps });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  rec.start(250); await v.play();
  await new Promise(res => { const tick = () => { ctx.drawImage(v, 0, 0, c.width, c.height); onProg && onProg(v.currentTime / v.duration); if (v.ended) return res(); requestAnimationFrame(tick); }; v.onended = res; tick(); });
  rec.stop(); await stopped; URL.revokeObjectURL(url);
  return new Blob(chunks, { type: mime.split(';')[0] });
}

    <label class="f">Notes<textarea id="mNotes">${esc(vd.notes || '')}</textarea></label>
    <div class="row"><button class="btn danger" id="vDel">Delete video</button>${vd.local ? '<span class="tiny muted">Saved on this device only</span>' : ''}</div>`, { full: true, onClose: () => { player = null; } });
  const el = m.el; const V = $('#pv', el), C = $('#pc', el); const ctx = C.getContext('2d');
  let doc = JSON.parse(JSON.stringify(vd)); doc.shapes = doc.shapes || []; doc.marks = doc.marks || {};
  const save = () => { Store.put(doc.id, doc, true); };
  let tool = 'none', drag = null; let V2 = null;
  const vids = () => [V, V2].filter(Boolean);
  V.playbackRate = 0.25;
  const contentRect = () => { const w = C.clientWidth, h = C.clientHeight, vw = V.videoWidth || 16, vh = V.videoHeight || 9; const s = Math.min(w / vw, h / vh); const cw = vw * s, ch = vh * s; return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch }; };
  const toN = (px, py) => { const r = contentRect(); return [(px - r.x) / r.w, (py - r.y) / r.h]; };
  const toP = (nx, ny) => { const r = contentRect(); return [r.x + nx * r.w, r.y + ny * r.h]; };
  const draw = () => {
    const dpr = window.devicePixelRatio || 1; C.width = C.clientWidth * dpr; C.height = C.clientHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, C.clientWidth, C.clientHeight);
    const all = drag ? doc.shapes.concat([drag]) : doc.shapes;
    for (const s of all) {
      const [x1, y1] = toP(s.a[0], s.a[1]), [x2, y2] = toP(s.b[0], s.b[1]);
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffd60a'; ctx.fillStyle = '#ffd60a'; ctx.font = '600 13px DM Sans';
      ctx.beginPath();
      if (s.t === 'line') { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); const ang = Math.abs(Math.atan2(-(y2 - y1), x2 - x1) * 180 / Math.PI); const a2 = ang > 90 ? 180 - ang : ang; ctx.fillText(Math.round(a2) + '°', x2 + 6, y2 - 6); }

  };
  const pos = e => { const r = C.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  C.addEventListener('pointerdown', e => { if (tool === 'none') { togglePlay(); return; } C.setPointerCapture(e.pointerId); const p = toN(...pos(e)); drag = { t: tool, a: p, b: p }; draw(); });

  V.addEventListener('timeupdate', sync); V.addEventListener('play', sync); V.addEventListener('pause', sync);

  $('#back', el).onclick = () => step(-1 / 30); $('#fwd', el).onclick = () => step(1 / 30);
  $('#scrub', el).oninput = e => { vids().forEach(x => { x.pause(); if (x.duration) x.currentTime = (+e.target.value / 1000) * x.duration; }); };
  $$('#speed button', el).forEach(b => b.onclick = () => { vids().forEach(x => x.playbackRate = +b.dataset.s); $$('#speed button', el).forEach(x => x.classList.toggle('on', x === b)); });
  $$('#tool button', el).forEach(b => b.onclick = () => { tool = b.dataset.t; $$('#tool button', el).forEach(x => x.classList.toggle('on', x === b)); });
  $('#undo', el).onclick = () => { doc.shapes.pop(); save(); draw(); };
  $('#clear', el).onclick = () => { doc.shapes = []; save(); draw(); };
  const showMarks = () => { const a = doc.marks.a ?? 0, b = doc.marks.b ?? V.duration; $('#marks', el).textContent = V.duration ? `Swing: ${fmtT(a)} → ${fmtT(b)}` : ''; };
  $('#markA', el).onclick = () => { doc.marks.a = r1(V.currentTime * 10) / 10; if (doc.marks.b != null && doc.marks.b <= doc.marks.a) delete doc.marks.b; save(); showMarks(); };
  $('#markB', el).onclick = () => { doc.marks.b = Math.round(V.currentTime * 100) / 100; save(); showMarks(); };
  $('#mClub', el).onchange = e => { doc.club = e.target.value.trim(); save(); };
  $('#mAngle', el).onchange = e => { doc.angle = e.target.value; save(); };
  $('#mNotes', el).onchange = e => { doc.notes = e.target.value; save(); };
  const cmp = $('#cmp', el);
  if (cmp) cmp.onchange = async () => {
    const box = $('#players', el); if (box.children[1]) box.children[1].remove(); V2 = null;
    const o = S.videos.find(x => x.id === cmp.value); if (!o) { draw(); return; }
    const s2 = await videoSrc(o); if (!s2) { toast('That video isn\'t available on this device'); return; }
    const w = document.createElement('div'); w.className = 'pwrap'; w.innerHTML = `<video playsinline muted preload="auto"></video>`; box.appendChild(w);
    V2 = $('video', w); V2.src = s2; V2.playbackRate = V.playbackRate;
    V2.addEventListener('loadedmetadata', () => { if (o.marks && o.marks.a) V2.currentTime = o.marks.a; });
    if (doc.marks.a) V.currentTime = doc.marks.a;

    setTimeout(draw, 50);
  };
  $('#vDel', el).onclick = async () => {
    if (!(await confirmBox('Delete this video and its notes?', { ok: 'Delete', danger: true }))) return;
    if (doc.assetId) { try { const assets = await claudeUse('assets'); assets && await assets.delete(doc.assetId); } catch (e) {} }
    if (doc.local) { try { await IDB.del(doc.id); } catch (e) {} }
    Store.del(doc.id); m.close(); hydrate(); render();
  };

    const btn = $('#aiGo', el); btn.disabled = true; const out = $('#aiOut', el); out.innerHTML = '<p class="muted">Grabbing frames…</p>';

      const nFrames = Math.min(8, typeof lim?.images === 'number' ? lim.images : 8);
      const a = doc.marks.a ?? 0, b = doc.marks.b ?? V.duration;

      const prompt = `You are an experienced PGA golf coach reviewing a student's swing.
The ${frames.length} attached images are frames in time order (first to last) from one golf swing video, filmed ${doc.angle || 'from an unknown angle'}. Club: ${doc.club || 'not stated'}. Golfer's handicap: ${pi.hi != null ? fmtHcp(pi.hi) : 'unknown'}. Golfer's notes: ${doc.notes || 'none'}.
Reply in plain text using these short headings:
Key positions — one line each for address, takeaway, top, transition/downswing, impact, finish, describing only what you can actually see.
Main issues — the 2 or 3 things most likely to be costing ball flight or consistency, with how confident you are given the frames.
Try this — one or two specific drills or feels for the most important issue.

      const res = await sample(prompt, { images: frames, modelTier: 'complex', onText: ({ text }) => { out.innerHTML = fmtAi(text); } });
      doc.analysis = { text: res.text, date: today() }; save();

    } catch (e) {
      out.innerHTML = `<p class="muted">${e && e.code === 'rate_limited' ? 'Too many requests — try again in a minute.' : e && e.code === 'not_granted' ? 'AI feedback wasn\'t allowed.' : 'Couldn\'t analyse this video' + (e && e.message ? ': ' + esc(e.message) : '.')}</p>`;

}
async function shrinkImage(file, max) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
function fmtAi(t) { return esc(t).split(/\n{2,}/).map(p => `<p>${p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</p>`).join(''); }
async function grabFrames(src, a, b, n) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('video could not be read')); });
  const sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc); const ctx = c.getContext('2d');
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = a + (b - a) * (n === 1 ? 0 : i / (n - 1));
    await new Promise(res => { v.onseeked = res; v.currentTime = Math.min(t, v.duration - 0.01); });
    ctx.drawImage(v, 0, 0, c.width, c.height);
    out.push(await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82)));
  }
  return out;
}

/* =========================================================
   BAG
   ========================================================= */
const CATS = ['Driver', 'Fairway wood', 'Hybrid', 'Iron', 'Wedge', 'Putter', 'Ball', 'Other'];
function clubLabel(c) { return c.label || (c.cat === 'Wedge' && c.loft ? c.loft + '° wedge' : c.cat); }
let bagView = 'current';
function renderBag(v) {
  const cur = S.bag.filter(b => !b.retired).sort((a, b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat) || (num(a.loft) || 0) - (num(b.loft) || 0));
  const past = S.bag.filter(b => b.retired).sort((a, b) => (b.retired || '').localeCompare(a.retired || ''));
  const clubCount = cur.filter(c => !['Ball', 'Other'].includes(c.cat)).length;
  const gaps = cur.filter(c => num(c.carry) != null && !['Ball', 'Other', 'Putter'].includes(c.cat)).sort((a, b) => num(b.carry) - num(a.carry));
  const item = c => `<div class="item" data-b="${c.id}"><div class="grow"><div class="t">${esc(clubLabel(c))}</div><div class="tiny muted">${esc([c.brand, c.model].filter(Boolean).join(' '))}${c.shaft ? ' · ' + esc(c.shaft) : ''}${c.flex ? ' ' + esc(c.flex) : ''}${c.loft && c.cat !== 'Wedge' ? ' · ' + esc(c.loft) + '°' : ''}</div><div class="tiny muted">${c.retired ? `${fmtDate(c.added)} → ${fmtDate(c.retired)}${c.reason ? ' · ' + esc(c.reason) : ''}` : c.added ? 'In bag since ' + fmtDate(c.added) : ''}</div></div>${num(c.carry) != null ? `<div style="text-align:right"><div class="num" style="font-weight:600">${c.carry}m</div><div class="tiny muted">carry</div></div>` : ''}</div>`;
  v.innerHTML = `<div class="spread"><h1>What's in the bag</h1><button class="btn primary sm" id="addClub">+ Add</button></div>
    <div class="seg" id="bv" style="margin-bottom:12px"><button data-v="current" class="${bagView === 'current' ? 'on' : ''}">Current (${cur.length})</button><button data-v="past" class="${bagView === 'past' ? 'on' : ''}">Past (${past.length})</button></div>
    ${bagView === 'current' ? `
      ${cur.length ? `<div class="small" style="margin:0 4px 10px">${clubCount} club${clubCount === 1 ? '' : 's'} ${clubCount > 14 ? '<span style="color:var(--bad);font-weight:600">· over the 14-club limit</span>' : clubCount === 14 ? '<span class="pill g">Full bag</span>' : `<span class="muted">· room for ${14 - clubCount} more</span>`}</div>
      <div class="card list">${cur.map(item).join('')}</div>` : `<div class="card empty">Add your clubs, ball and gear. When you swap something out, retire it — it moves to Past so you keep a history.</div>`}
      ${gaps.length >= 2 ? `<div class="card"><h3>Distance gapping (carry)</h3>${bars(gaps.map(c => ({ k: clubLabel(c), v: num(c.carry) })), { fmt: v => v + 'm' })}
        <p class="tiny muted" style="margin:8px 0 0">${gapNote(gaps)}</p></div>` : ''}`
    : (past.length ? `<div class="card list">${past.map(item).join('')}</div>` : `<div class="card empty">Retired equipment shows up here.</div>`)}`;
  $('#addClub').onclick = () => clubEditor(null);
  $$('#bv button').forEach(b => b.onclick = () => { bagView = b.dataset.v; render(); });
  $$('[data-b]', v).forEach(el => el.onclick = () => clubEditor(S.bag.find(x => x.id === el.dataset.b)));
}
function gapNote(g) {
  const issues = [];
  for (let i = 0; i < g.length - 1; i++) { const d = num(g[i].carry) - num(g[i + 1].carry); if (d > 20) issues.push(`${d}m gap between ${clubLabel(g[i])} and ${clubLabel(g[i + 1])}`); if (d < 6) issues.push(`only ${d}m between ${clubLabel(g[i])} and ${clubLabel(g[i + 1])}`); }
  return issues.length ? 'Worth a look: ' + issues.join('; ') + '.' : 'Gaps look even.';
}
function clubEditor(c) {
  const x = c ? { ...c } : { id: uid('b'), kind: 'club', cat: 'Iron', label: '', brand: '', model: '', loft: '', shaft: '', flex: '', carry: '', total: '', added: today(), retired: null, reason: '', notes: '' };
  const m = openSheet(`<div class="hd"><h2>${c ? 'Edit' : 'Add equipment'}</h2><button class="x" data-close>×</button></div>
    <div class="grid2"><label class="f">Type<select id="kCat">${CATS.map(k => `<option ${x.cat === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label><label class="f">Name<input id="kLabel" value="${esc(x.label)}" placeholder="e.g. 7 iron, 3 wood"></label></div>
    <div class="grid2"><label class="f">Brand<input id="kBrand" value="${esc(x.brand)}"></label><label class="f">Model<input id="kModel" value="${esc(x.model)}"></label></div>
    <div class="grid3"><label class="f">Loft °<input id="kLoft" type="number" step="0.5" value="${esc(x.loft)}"></label><label class="f">Shaft<input id="kShaft" value="${esc(x.shaft)}"></label><label class="f">Flex<input id="kFlex" value="${esc(x.flex)}" placeholder="R, S, X"></label></div>
    <div class="grid3"><label class="f">Carry (m)<input id="kCarry" type="number" value="${esc(x.carry)}"></label><label class="f">Total (m)<input id="kTotal" type="number" value="${esc(x.total)}"></label><label class="f">In bag since<input id="kAdded" type="date" value="${esc(x.added)}"></label></div>
    <label class="f">Notes<textarea id="kNotes" placeholder="Specs, lie angle, grip, where you bought it…">${esc(x.notes)}</textarea></label>
    ${x.retired ? `<div class="grid2"><label class="f">Retired<input id="kRet" type="date" value="${esc(x.retired)}"></label><label class="f">Why<input id="kReason" value="${esc(x.reason)}"></label></div>` : ''}
    <div class="row wrap"><button class="btn primary" id="kSave" style="flex:1">Save</button>
    ${c && !x.retired ? '<button class="btn" id="kRetire">Retire</button>' : ''}${c && x.retired ? '<button class="btn" id="kRestore">Back in bag</button>' : ''}${c ? '<button class="btn danger" id="kDel">Delete</button>' : ''}</div>`);
  const el = m.el;
  const read = () => { x.cat = $('#kCat', el).value; x.label = $('#kLabel', el).value.trim(); x.brand = $('#kBrand', el).value.trim(); x.model = $('#kModel', el).value.trim(); x.loft = $('#kLoft', el).value; x.shaft = $('#kShaft', el).value.trim(); x.flex = $('#kFlex', el).value.trim(); x.carry = $('#kCarry', el).value; x.total = $('#kTotal', el).value; x.added = $('#kAdded', el).value; x.notes = $('#kNotes', el).value; if ($('#kRet', el)) { x.retired = $('#kRet', el).value || x.retired; x.reason = $('#kReason', el).value.trim(); } };

  const rt = $('#kRetire', el); if (rt) rt.onclick = () => {
    read(); const r = openSheet(`<div class="hd"><h2>Retire ${esc(clubLabel(x))}</h2><button class="x" data-close>×</button></div><label class="f">Date<input id="rD" type="date" value="${today()}"></label><label class="f">Reason<input id="rW" placeholder="e.g. Replaced by new driver"></label><button class="btn primary block" id="rGo">Move to past equipment</button>`);
    $('#rGo', r.el).onclick = () => { x.retired = $('#rD', r.el).value || today(); x.reason = $('#rW', r.el).value.trim(); r.close(); commit(); };
  };

  const dl = $('#kDel', el); if (dl) dl.onclick = async () => { if (await confirmBox('Delete this item completely? (Retire it instead to keep the history.)', { ok: 'Delete', danger: true })) { Store.del(x.id); m.close(); hydrate(); render(); } };
}

    <div class="row wrap"><button class="btn sm" id="gCopy">Copy backup</button><button class="btn sm" id="gImp">Restore from backup</button></div>
    <p class="tiny muted">Copy backup copies everything except swing videos saved on this device.</p>
    <button class="btn primary block" id="gSave" style="margin-top:12px">Save</button>`);
  const el = m.el;
  const dl = $('#gDl', el); if (dl) dl.onclick = () => Cloud.downloadBackup();
  const lk = $('#gLock', el); if (lk) lk.onclick = async () => { if (await confirmBox('Remove the key from this phone? Your data stays in the cloud; you\'ll need the key to unlock again.', { ok: 'Lock' })) { try { localStorage.removeItem('splonk.key'); } catch (e) {} location.reload(); } };
